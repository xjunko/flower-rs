[workspace]
resolver = "3"
members = ["flower-apps/*", "flower-kernel", "flower-libc", "flower-mono"]
exclude = [
    "flower-apps/target",
    "flower-apps/template",
    "flower-apps/musl",
    "flower-apps/image",
    "flower-apps/mp3",
]

[workspace.package]
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = "abort"
opt-level = 1
debug = true
strip = false

[profile.release]
panic = "abort"
opt-level = 3
debug = false
overflow-checks = false
strip = true
