repos:
  - repo: local
    hooks:
      - id: fmt-kernel
        name: fmt (kernel)
        entry: bash -c 'cd flower-core && cargo fmt --check'
        language: system
        files: '^flower-core/.*\.rs$'
        pass_filenames: false

  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.1
    hooks:
      - id: cargo-machete

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        files: '.*\.rs$'
        args:
          - --license-filepath
          - LICENSE
          - --comment-style
          - /*| *| */
